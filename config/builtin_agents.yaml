# Built-in Agent Configuration with i18n support
# Each agent has localized name, description, avatar, and config overrides per language.
# The "default" locale is used as fallback when the user's language is not found.

builtin_agents:
  - id: "builtin-quick-answer"
    avatar: ""
    is_builtin: true
    i18n:
      default:
        name: "Instant Q&A"
        description: "Knowledge base RAG Q&A for fast and accurate answers"
      zh-CN:
        name: "即时问答"
        description: "基于知识库的 RAG 问答，快速准确地回答问题"
      zh-TW:
        name: "即時問答"
        description: "基於知識庫的 RAG 問答，快速準確地回答問題"
      ja-JP:
        name: "即時回答"
        description: "ナレッジベース RAG Q&A による迅速で正確な回答"
      ko-KR:
        name: "즉시 질의"
        description: "지식 베이스 RAG Q&A를 통한 빠르고 정확한 답변"
      ru-RU:
        name: "Мгновенный ответ"
        description: "RAG-вопросы и ответы по базе знаний"
    config:
      agent_mode: "quick-answer"
      system_prompt_id: "default_kb"
      context_template_id: "default_context"
      temperature: 0.7
      max_completion_tokens: 2048
      web_search_enabled: true
      web_search_max_results: 5
      multi_turn_enabled: true
      history_turns: 5
      kb_selection_mode: "all"
      retrieve_kb_only_when_mentioned: false
      faq_priority_enabled: true
      faq_direct_answer_threshold: 0.9
      faq_score_boost: 1.2
      embedding_top_k: 10
      keyword_threshold: 0.3
      vector_threshold: 0.5
      rerank_top_k: 10
      rerank_threshold: 0.3
      enable_query_expansion: true
      enable_rewrite: true
      fallback_strategy: "model"

  - id: "builtin-smart-reasoning"
    avatar: ""
    is_builtin: true
    i18n:
      default:
        name: "Reasoning Q&A"
        description: "ReAct reasoning framework with multi-step thinking and tool calling"
      zh-CN:
        name: "推理问答"
        description: "ReAct 推理框架，支持多步思考与工具调用"
      zh-TW:
        name: "推理問答"
        description: "ReAct 推理框架，支援多步思考與工具呼叫"
      ja-JP:
        name: "推論回答"
        description: "ReAct 推論フレームワーク、マルチステップ思考とツール呼び出し対応"
      ko-KR:
        name: "추론 질의"
        description: "ReAct 추론 프레임워크, 다단계 사고 및 도구 호출 지원"
      ru-RU:
        name: "Ответ с рассуждением"
        description: "ReAct-рассуждение с многошаговым мышлением и вызовом инструментов"
    config:
      agent_mode: "smart-reasoning"
      agent_type: "rag-qa"
      system_prompt: ""
      temperature: 0.7
      max_completion_tokens: 2048
      max_iterations: 50
      kb_selection_mode: "all"
      retrieve_kb_only_when_mentioned: false
      allowed_tools:
        - "knowledge_search"
        - "grep_chunks"
        - "list_knowledge_chunks"
        - "query_knowledge_graph"
        - "get_document_info"
      web_search_enabled: true
      web_search_max_results: 5
      reflection_enabled: false
      multi_turn_enabled: true
      history_turns: 5
      faq_priority_enabled: true
      faq_direct_answer_threshold: 0.9
      faq_score_boost: 1.2
      embedding_top_k: 10
      keyword_threshold: 0.3
      vector_threshold: 0.5
      rerank_top_k: 10
      rerank_threshold: 0.3

  - id: "builtin-data-analyst"
    avatar: "📊"
    is_builtin: true
    i18n:
      default:
        name: "Table Analysis"
        description: "SQL query and statistical analysis for CSV/Excel files"
      zh-CN:
        name: "表格分析"
        description: "针对 CSV、Excel 查看表结构、做统计和 SQL 查询"
      zh-TW:
        name: "表格分析"
        description: "針對 CSV、Excel 查看表結構、做統計和 SQL 查詢"
      ja-JP:
        name: "表分析"
        description: "CSV/Excel ファイルの表構造確認、統計分析、SQL クエリ"
      ko-KR:
        name: "표 분석"
        description: "CSV/Excel 파일의 표 구조 확인, 통계 및 SQL 쿼리"
      ru-RU:
        name: "Анализ таблиц"
        description: "SQL-запросы и статистика по CSV/Excel файлам"
    config:
      agent_mode: "smart-reasoning"
      agent_type: "data-analysis"
      system_prompt_id: "data_analyst"
      temperature: 0.3
      max_completion_tokens: 4096
      max_iterations: 30
      kb_selection_mode: "all"
      retrieve_kb_only_when_mentioned: false
      supported_file_types:
        - "csv"
        - "xlsx"
      allowed_tools:
        - "data_schema"
        - "data_analysis"
      web_search_enabled: false
      web_search_max_results: 0
      reflection_enabled: true
      multi_turn_enabled: true
      history_turns: 10
      embedding_top_k: 5
      keyword_threshold: 0.3
      vector_threshold: 0.5
      rerank_top_k: 5
      rerank_threshold: 0.3

  - id: "builtin-wiki-researcher"
    avatar: "📚"
    is_builtin: true
    i18n:
      default:
        name: "Wiki Q&A"
        description: "Specialized agent for answering questions based on Wiki knowledge bases"
      zh-CN:
        name: "维基问答"
        description: "专注于在 Wiki 知识库中回答问题的智能体"
      zh-TW:
        name: "維基問答"
        description: "專注於在 Wiki 知識庫中回答問題的智能體"
      ja-JP:
        name: "Wiki問答"
        description: "Wikiナレッジベースでの回答問題に特化したエージェント"
      ko-KR:
        name: "위키 질의"
        description: "위키 지식 베이스에서 답변하는 데 특화된 에이전트"
      ru-RU:
        name: "Wiki-вопросы"
        description: "Ответы на вопросы по Wiki-базам знаний"
    config:
      agent_mode: "smart-reasoning"
      agent_type: "wiki-qa"
      system_prompt_id: "wiki_researcher"
      temperature: 0.7
      max_completion_tokens: 4096
      max_iterations: 30
      kb_selection_mode: "all"
      retrieve_kb_only_when_mentioned: false
      allowed_tools:
        - "wiki_search"
        - "wiki_read_page"
        - "wiki_read_source_doc"
        - "wiki_flag_issue"
      web_search_enabled: false
      web_search_max_results: 0
      reflection_enabled: false
      multi_turn_enabled: true
      history_turns: 10
      embedding_top_k: 10
      keyword_threshold: 0.3
      vector_threshold: 0.5
      rerank_top_k: 10
      rerank_threshold: 0.3

  - id: "builtin-wiki-fixer"
    avatar: "🔧"
    is_builtin: true
    i18n:
      default:
        name: "Wiki Fixer"
        description: "Specialized agent for revising Wiki pages based on inspection issues"
      zh-CN:
        name: "维基修订"
        description: "专门用于根据巡检问题修订 Wiki 页面的智能体"
      zh-TW:
        name: "維基修訂"
        description: "專門用於根據巡檢問題修訂 Wiki 頁面的智能體"
      ja-JP:
        name: "Wiki 修訂"
        description: "検査の問題に基づいてWikiページを修復および最適化するための専用エージェント"
      ko-KR:
        name: "위키 수정"
        description: "검사 문제를 기반으로 Wiki 페이지를 修復하고 最適化하는 전용 에이전트"
      ru-RU:
        name: "Редактор Wiki"
        description: "Правка Wiki-страниц по результатам проверки"
    config:
      agent_mode: "smart-reasoning"
      agent_type: "custom"
      system_prompt_id: "wiki_fixer"
      temperature: 0.7
      max_completion_tokens: 4096
      max_iterations: 30
      kb_selection_mode: "selected"
      retrieve_kb_only_when_mentioned: false
      retain_retrieval_history: true
      allowed_tools:
        - "wiki_search"
        - "wiki_read_page"
        - "wiki_read_source_doc"
        - "wiki_write_page"
        - "wiki_replace_text"
        - "wiki_rename_page"
        - "wiki_delete_page"
        - "wiki_read_issue"
        - "wiki_update_issue"
      web_search_enabled: false
      web_search_max_results: 0
      reflection_enabled: false
      multi_turn_enabled: true
      history_turns: 10
      embedding_top_k: 10
      keyword_threshold: 0.3
      vector_threshold: 0.5
      rerank_top_k: 10
      rerank_threshold: 0.3

