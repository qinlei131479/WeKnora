# Tomcat
server:
  port: 9208

# Spring
spring:
  application:
    # 应用名称
    name: business
  profiles:
    # 环境配置
    active: @profiles.active@
  cloud:
    nacos:
      username: @nacos.username@
      password: @nacos.password@
      discovery:
        # 服务注册地址
        server-addr: @nacos.serverAddr@
        namespace: @nacos.namespace@
        group: @profiles.active@
        ip: 192.168.170.56
      config:
        # 配置中心地址
        server-addr: ${spring.cloud.nacos.discovery.server-addr}
        # 配置文件格式
        file-extension: yml
        namespace: ${spring.cloud.nacos.discovery.namespace}
        group: @profiles.active@
  config:
    # 配置文件格式
    file-extension: yml
    import:
      - nacos:application.${spring.config.file-extension}
      - nacos:${spring.application.name}.${spring.config.file-extension}
