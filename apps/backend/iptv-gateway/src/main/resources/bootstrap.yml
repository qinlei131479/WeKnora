# Tomcat
server:
  port: 9206

# Spring
spring:
  main:
    web-application-type: reactive
  application:
    # 应用名称
    name: gateway
  profiles:
    # 环境配置
    active: @profiles.active@
  cloud:
    nacos:
      username: @nacos.username@
      password: @nacos.password@
      discovery:
        # 服务注册地址
        server-addr: @nacos.serverAddr@
        namespace: @nacos.namespace@
        group: @profiles.active@
      config:
        # 配置中心地址
        server-addr: ${spring.cloud.nacos.discovery.server-addr}
        # 配置文件格式
        file-extension: yml
        namespace: ${spring.cloud.nacos.discovery.namespace}
        group: @profiles.active@
    sentinel:
      # 取消控制台懒加载
      eager: true
      transport:
        # 控制台地址
        dashboard: @nacos.serverAddr@
      # nacos配置持久化
      datasource:
        ds1:
          nacos:
            server-addr: @nacos.serverAddr@
            dataId: sentinel-gateway
            groupId: @profiles.active@
            data-type: json
            rule-type: gw-flow
  config:
    # 配置文件格式
    file-extension: yml
    import:
      - nacos:application.${spring.config.file-extension}
      - nacos:${spring.application.name}.${spring.config.file-extension}
